name: Publicar Posts Agendados

on:
  schedule:
    # Executa 4 vezes ao dia nos horários de pico (08h, 12h, 16h e 20h de Brasília)
    - cron: '0 11,15,19,23 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub Actions

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar e Publicar Posts Vencidos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/agendador.py --verificar
